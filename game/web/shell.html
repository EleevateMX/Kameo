<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ALUX: El Despertar de Kukulkán</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1512; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: #fff8ea; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: linear-gradient(rgba(6, 14, 12, .55), rgba(6, 14, 12, .88)), url('/art/keyart.jpg') center / cover no-repeat, #0b1512;
    transition: opacity .6s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: clamp(48px, 12vw, 120px); margin: 0; letter-spacing: .08em; color: #ffd23f; text-shadow: 0 6px 0 rgba(0, 0, 0, .4); }
  #loading p { margin: 6px 0 22px; color: #9ff0dc; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; }
  #bar { width: min(420px, 70vw); height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .15); overflow: hidden; margin: 0 auto; }
  #bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #2ec4a6, #ffd23f); transition: width .2s; }
  #status { margin-top: 14px; font-size: 14px; color: #d8cfe0; min-height: 1.4em; }
  #back { position: fixed; top: 12px; right: 12px; z-index: 5; padding: 8px 14px; border-radius: 999px; background: rgba(10, 20, 17, .75);
    color: #fff8ea; text-decoration: none; font-size: 13px; border: 1px solid rgba(255, 255, 255, .2); }
  #back:hover { border-color: #2ec4a6; }
  /* Botón discreto de pantalla completa (abajo a la izquierda, fuera de la interfaz del juego) */
  #fs { position: fixed; left: 10px; bottom: 10px; z-index: 4; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
    background: rgba(10, 20, 17, .55); color: #fff8ea; border: 1px solid rgba(255, 255, 255, .22); opacity: .45; font-size: 17px; line-height: 1;
    display: none; align-items: center; justify-content: center; padding: 0; transition: opacity .2s, border-color .2s; }
  #fs:hover, #fs:focus-visible { opacity: 1; border-color: #2ec4a6; outline: none; }
  #fs.on { display: flex; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Tu navegador no soporta canvas.</canvas>
<div id="loading">
  <div>
    <h1>ALUX</h1>
    <p>El Despertar de Kukulkán</p>
    <div id="bar"><div></div></div>
    <div id="status">Cargando el claro…</div>
  </div>
</div>
<button id="fs" type="button" aria-label="Pantalla completa" title="Pantalla completa">&#x26F6;</button>
<script src="cine-video.js"></script>
<!-- Mezclador propio (música, ambientes, limitador, aviso de audio bloqueado). Va antes que el motor:
     captura su AudioContext al crearse. Ver docs/AUDIO.md -->
<script src="alux-audio.js"></script>
<script src="$GODOT_URL"></script>
<script>
// Pantalla completa (Fullscreen API). Una página no puede pulsar F11 por el jugador: sólo puede
// pedirla dentro de un gesto suyo (clic o tecla), y el navegador puede negarla. Si la niega o el
// jugador sale con Esc, la partida sigue igual en ventana. La preferencia se recuerda.
window.ALUX_FS = (() => {
  // Si el juego va dentro del portal (/play/…), la pantalla completa es la de la página de fuera
  let host = window;
  try { if (window.top && window.top !== window && window.top.document) host = window.top; } catch (e) { host = window; }
  const doc = host.document;
  const el = doc.documentElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
  const supported = !!request && (doc.fullscreenEnabled !== false);
  const KEY = 'alux_fullscreen';
  const api = {
    supported,
    failed: '',
    active: () => !!(doc.fullscreenElement || doc.webkitFullscreenElement),
    pref: () => { try { return localStorage.getItem(KEY) !== '0'; } catch (e) { return true; } },
    setPref: (on) => { try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) { /* sin almacenamiento */ } },
    enter: () => {
      if (!supported || api.active()) return Promise.resolve(api.active());
      let p;
      try { p = request.call(el, { navigationUI: 'hide' }); } catch (e) { p = Promise.reject(e); }
      return Promise.resolve(p).then(() => true).catch((e) => { api.failed = String((e && e.name) || e); return false; });
    },
    leave: () => { if (api.active() && exit) { try { return Promise.resolve(exit.call(doc)).catch(() => {}); } catch (e) { /* nada */ } } return Promise.resolve(); },
    // El botón y el menú del juego: cambia de modo y recuerda lo elegido
    toggle: () => { const on = !api.active(); api.setPref(on); return on ? api.enter() : api.leave(); },
  };
  const sync = () => {
    const btn = document.getElementById('fs');
    if (btn) {
      btn.classList.toggle('on', supported);
      btn.title = api.active() ? 'Salir de pantalla completa' : 'Pantalla completa';
      btn.setAttribute('aria-label', btn.title);
      btn.setAttribute('aria-pressed', api.active() ? 'true' : 'false');
    }
    // En Chrome y Edge, con pantalla completa, Esc llega al juego (abre su menú) en vez de
    // sacar al jugador; mantenerla pulsada sigue saliendo. Donde no existe, Esc sale: no pasa nada.
    try {
      const kb = host.navigator.keyboard;
      if (kb && kb.lock) { if (api.active()) kb.lock(['Escape']).catch(() => {}); else kb.unlock(); }
    } catch (e) { /* sin bloqueo de teclado */ }
    const canvas = document.getElementById('canvas');
    if (canvas) canvas.focus();
  };
  doc.addEventListener('fullscreenchange', sync);
  doc.addEventListener('webkitfullscreenchange', sync);
  window.addEventListener('DOMContentLoaded', () => {
    sync();
    const btn = document.getElementById('fs');
    if (btn) btn.addEventListener('click', (ev) => { ev.preventDefault(); api.toggle(); btn.blur(); });
  });
  return api;
})();

// Configuración que lee el juego (game/scripts/client/game_client.gd)
const params = new URLSearchParams(location.search);
const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
window.ALUX = { room, ticket: '', wsUrl: '', error: '', cine: params.get('cine') !== '0', quality: ['min', 'low', 'high'].includes(params.get('q')) ? params.get('q') : 'auto' };
window.ALUX_DEBUG = params.get('debug') === '1';
// Quien llega directo al juego (un enlace, una recarga) entra en pantalla completa con su primer
// clic o tecla, si así lo prefiere. Desde el portal ya la pidió el botón JUGAR. Una sola vez: si
// después sale con Esc, no se le vuelve a meter. (En las pruebas automáticas, sólo con ?fs=1.)
if (ALUX_FS.supported && (params.get('fs') === '1' || (!ALUX_DEBUG && params.get('fs') !== '0'))) {
  const first = (ev) => {
    if (ev.target && ev.target.id === 'fs') return;
    window.removeEventListener('pointerdown', first, true);
    window.removeEventListener('keydown', first, true);
    if (ALUX_FS.pref() && !ALUX_FS.active()) ALUX_FS.enter();
  };
  window.addEventListener('pointerdown', first, true);
  window.addEventListener('keydown', first, true);
}
const statusEl = document.getElementById('status');

// Pide a la API un ticket de un solo uso para esta sala (usa la cookie de sesión)
window.aluxRefreshTicket = async () => {
  ALUX.ticket = '';
  ALUX.error = '';
  if (!room) { ALUX.error = 'room_not_found'; return; }
  try {
    const res = await fetch(`/api/v1/rooms/${encodeURIComponent(room)}/ticket`, {
      method: 'POST', headers: { 'x-alux-csrf': '1' }, credentials: 'same-origin',
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      (window.top || window).location.href = '/?next=' + encodeURIComponent('/play/' + room);
      return;
    }
    if (!res.ok) { ALUX.error = data.error || 'ticket_failed'; return; }
    ALUX.wsUrl = data.wsUrl;
    ALUX.ticket = data.ticket;
  } catch (e) {
    ALUX.error = 'network';
  }
};
aluxRefreshTicket();

const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
  statusEl.textContent = 'Tu navegador no puede ejecutar el juego (falta: ' + missing.join(', ') + '). Prueba con Chrome, Edge o Firefox actualizados.';
} else {
  engine.startGame({
    onProgress: (current, total) => {
      if (total > 0) document.querySelector('#bar > div').style.width = Math.round((current / total) * 100) + '%';
    },
  }).then(() => {
    ALUX.engineMs = Math.round(performance.now());   // desde que se abrió la página hasta que arrancó el motor
    document.getElementById('loading').classList.add('done');
    if (window.ALUX_SND) ALUX_SND.gameStarted();
    document.getElementById('canvas').focus();
  }).catch((err) => {
    statusEl.textContent = 'No se pudo iniciar el juego: ' + (err && err.message ? err.message : err);
  });
}
</script>
</body>
</html>
