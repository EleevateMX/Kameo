# Blueprint de Render para la beta privada de ALUX.
# Crea DOS recursos y nada más: un servicio web (todo ALUX en un contenedor) y su PostgreSQL.
# Guía paso a paso, costos y alternativas: docs/beta.md
#
# - Se despliega sólo desde la rama `beta` (lo que se sube a otras ramas no se publica).
# - Los secretos los genera Render o se escriben en su panel; ninguno vive en este archivo.
# - La base de datos no admite conexiones desde Internet (ipAllowList vacía): sólo el
#   servicio web la alcanza por la red privada de Render.

services:
  - type: web
    name: alux-beta
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb          # antes "starter". Con `free` el servicio se duerme a los 15 min sin tráfico
    region: ohio
    branch: beta
    autoDeployTrigger: commit # cada commit que llegue a `beta` se despliega; el resto de ramas, no
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alux-beta-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GAME_TICKET_SECRET
        generateValue: true
      - key: SERVICE_KEY
        generateValue: true
      # Acceso temporal de testers (se apaga solo al configurar Discord)
      - key: BETA_ACCESS
        value: invite
      - key: BETA_INVITES     # huellas de los códigos; se generan con `npm run beta:invites`
        sync: false
      # BASE_URL no hace falta: se toma de RENDER_EXTERNAL_URL (https://alux-beta-xxxx.onrender.com).
      # Con dominio propio, añade BASE_URL=https://tu-dominio en el panel.
      # Discord (cuando haya credenciales): añade DISCORD_CLIENT_ID y DISCORD_CLIENT_SECRET en el panel.

databases:
  - name: alux-beta-db
    databaseName: alux
    user: alux
    plan: 0.1c-256mb          # antes "basic-256mb". `free` caduca a los 30 días y no tiene respaldos
    diskSizeGB: 1
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []           # sin acceso externo
